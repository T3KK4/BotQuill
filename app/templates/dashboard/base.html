<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A simple responsive HTML page"
  >
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous">

  <title>{% block title %} Cynthia | Admin {% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/dashboard.css') }}">
</head>

<body class="main-content">
  
  <!-- Sidebar -->
  {% include 'dashboard/components/sidebar.html' %}
  <!-- End Sidebar -->

  <!-- Main Content -->
  <div class="content-wrapper">
      {% block content %}{% endblock %}
  </div>
  <!-- End of Main Content -->

  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navLinks = document.querySelectorAll('.navbar .nav-link');
      const aboutLink = document.querySelector('.navbar .nav-link[href$="#about"]');

      function updateHashActiveLink() {
        if (!aboutLink) return;

        const isAboutSection = window.location.hash === '#about';
        aboutLink.classList.toggle('active', isAboutSection);
        aboutLink.toggleAttribute('aria-current', isAboutSection);

        if (isAboutSection) {
          navLinks.forEach((link) => {
            if (link !== aboutLink) {
              link.classList.remove('active');
              link.removeAttribute('aria-current');
            }
          });
        }
      }

      updateHashActiveLink();
      window.addEventListener('hashchange', updateHashActiveLink);
    });
  </script>

</body>
</html>
