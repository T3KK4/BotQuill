<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A simple responsive HTML page"
  >
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous">

  <title>{% block title %} Bot Cynthia {% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
</head>

<body class="site-layout">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        
        <a class="navbar-brand" href="#">
            Cynthia
        </a>
        
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Cynthia's Library</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>

          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-center flex-grow-1 pe-3">
                <li class="nav-item">
                  <a class="nav-link mx-lg-2 active" aria-current="page" href="{{ url_for('main.index') }}">Home</a>
                </li>

                <li class="nav-item">
                  <a class="nav-link mx-lg-2" href="#about">About</a>
                </li>

                <li class="nav-item">
                  <a class="nav-link mx-lg-2" href="{{ url_for('main.books') }}">Books</a>
                </li>

                <li class="nav-item">
                  <a class="nav-link mx-lg-2" href="{{ url_for('main.blog') }}">Blog</a>
                </li>

                
              </ul>
          </div>
        </div>
        <a href="{{ url_for('auth.login') }}" class="login-button">Login</a>

        <button class="navbar-toggler pe-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
    </div>
  </nav>
  <!-- End of Navigation Bar -->
  
  <!-- Main Content -->
  <div class="content-wrapper">
      {% block content %}{% endblock %}
  </div>
  <!-- End of Main Content -->

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="row align-items-center gy-3">
        <div class="col-12 col-md-4 text-md-start">
          <p class="mb-0">&copy; 2026 Cynthia's Library. All rights reserved.</p>
        </div>

        <div class="col-12 col-md-4">
          <a href="mailto:cynthbot6@gmail.com" class="text-decoration-none text-muted" aria-label="Email Cynthia">
            <i class="fa-solid fa-envelope me-2" aria-hidden="true"></i>cynthbot6@gmail.com
          </a>
        </div>

        <div class="col-12 col-md-4 text-md-end">
          <a href="https://www.linkedin.com/in/cynthia-bot-784972291?utm_source=share_via&utm_content=profile&utm_medium=member_android" class="text-muted me-3" aria-label="LinkedIn"><i class="fa-brands fa-linkedin fa-lg" aria-hidden="true"></i></a>
          <a href="#" class="text-muted me-3" aria-label="Instagram"><i class="fa-brands fa-instagram fa-lg" aria-hidden="true"></i></a>
          <a href="#" class="text-muted me-3" aria-label="X (formerly Twitter)"><i class="fa-brands fa-twitter fa-lg" aria-hidden="true"></i></a>
          <a href="https://substack.com/@saltedlight1?utm_source=share&utm_medium=android&r=6r73e3" class="text-muted" aria-label="Substack"><svg xmlns="http://www.w3.org/2000/svg" width="1.25em" height="1.25em" fill="currentColor" viewBox="0 0 16 16" style="vertical-align: -0.125em;">
          <path d="M15 3.604H1v1.891h14v-1.89ZM1 7.208V16l7-3.926L15 16V7.208zM15 0H1v1.89h14z"/></svg></a>
        </div>
      </div>
    </div>
  </footer>
  <!-- End of Footer -->

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</body>
</html>
